<style>
  :root { color-scheme: light; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { height: 100%; margin: 0; background: #fff; color: #000; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Courier New", monospace; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  *, *::before, *::after { transition: none !important; animation: none !important; }
  #evade { position: absolute; left: 50%; top: 60%; touch-action: none; }
</style>
</head>
<body class="bg-white text-black">

<header class="absolute left-0 right-0 top-0 flex flex-col items-center px-4 pt-6" style="padding-top: calc(env(safe-area-inset-top, 0px) + 1.5rem);">
  <div class="border border-black px-3 py-1 text-xs tracking-widest">DEAL OR NO DEAL</div>
  <p class="mt-3 max-w-md text-center text-sm leading-relaxed">I am sorry. Catch the button and forgive me. If you can't, the deal is I get to study in peace and you get to be right.</p>
  <p id="msg" class="mt-3 max-w-md text-center text-xs leading-relaxed">Take a breath first. The button is very fast.</p>
</header>

<button id="evade" type="button" class="border border-black bg-white px-6 py-3 text-base text-black whitespace-nowrap cursor-pointer">Click to Forgive</button>

<footer class="absolute bottom-0 left-0 z-20 p-3" style="padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 0.75rem);">
  <button id="force" type="button" class="text-[10px] text-black underline cursor-pointer bg-transparent border-0 p-1">Force Forgive</button>
</footer>

<div id="os" class="fixed inset-0 z-50 hidden bg-white" style="touch-action: pan-y;">
  <div id="icons" class="absolute left-3 flex flex-col gap-3" style="top: calc(env(safe-area-inset-top, 0px) + 12px);">
    <button data-open="w-readme" class="w-20 text-center text-xs"><span class="mx-auto mb-1 flex h-10 w-8 items-center justify-center border border-black text-[9px]">TXT</span>README.txt</button>
    <button data-open="w-bin" class="w-20 text-center text-xs"><span class="mx-auto mb-1 flex h-10 w-8 items-center justify-center border border-black text-[9px]">BIN</span>Recycle Bin</button>
    <button data-open="w-pics" class="w-20 text-center text-xs"><span class="mx-auto mb-1 flex h-10 w-8 items-center justify-center border border-black text-[9px]">DIR</span>Pictures</button>
    <button data-open="w-arc" class="w-20 text-center text-xs"><span class="mx-auto mb-1 flex h-10 w-8 items-center justify-center border border-black text-[9px]">GAME</span>Arcade.exe</button>
    <button data-open="w-exe" class="w-20 text-center text-xs"><span class="mx-auto mb-1 flex h-10 w-8 items-center justify-center border border-black bg-black text-[9px] text-white">EXE</span>Forgiveness.exe</button>
  </div>
  <div id="wins"></div>
  <div class="absolute bottom-0 left-0 right-0 z-[999] flex items-center justify-between border-t border-black bg-white px-2 py-1" style="padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 4px);">
    <button id="shut" class="border border-black px-3 py-1 text-xs">Shut Down</button>
    <span id="clock" class="text-xs"></span>
  </div>
</div>
<div id="off" class="fixed inset-0 z-[2000] hidden items-center justify-center bg-white p-8 text-center">
  <div><p class="text-lg">It is now safe to turn off your computer.</p><p class="mt-6 text-xs">Forgiven. Go be right somewhere else. I have a test to pass.</p></div>
</div>

<script>
(function () {
  var btn = document.getElementById('evade');
  var force = document.getElementById('force');
  var end = document.getElementById('end');
  var px = -1, py = -1;

  var lines = [
    'Slow down. Breathe in.',
    'The button is shy. It is not you.',
    'Almost. Not really. But almost.',
    'Breathe out. You are doing great.',
    'It has been to the gym. Skipping leg day was not an option for it.',
    'You are allowed to be mad. You are also allowed to cheat.',
    'Unclench your jaw. Now try again.',
    'Still nothing. The button has no loyalty.',
    'Fine. Force Forgive exists. I will not tell anyone.'
  ];
  var dodges = 0;
  var msg = document.getElementById('msg');

  function teleport() {
    dodges++;
    if (dodges > 1) msg.textContent = lines[(dodges - 2) % lines.length];
    var w = window.innerWidth, h = window.innerHeight;
    var bw = btn.offsetWidth, bh = btn.offsetHeight;
    var minTop = 110, minBottom = 40; // keep clear of header and footer
    var x, y, tries = 0;
    do {
      x = Math.random() * Math.max(1, w - bw);
      y = minTop + Math.random() * Math.max(1, h - bh - minTop - minBottom);
      tries++;
      // never land under the pointer
    } while (tries < 30 && px >= 0 &&
             px > x - 20 && px < x + bw + 20 && py > y - 20 && py < y + bh + 20);
    btn.style.left = x + 'px';
    btn.style.top = y + 'px';
  }

  function track(e) { px = e.clientX; py = e.clientY; }

  document.addEventListener('pointermove', track);
  btn.addEventListener('pointerenter', function (e) { track(e); teleport(); });
  btn.addEventListener('pointerdown', function (e) { e.preventDefault(); track(e); teleport(); });
  btn.addEventListener('touchstart', function (e) { e.preventDefault(); teleport(); }, { passive: false });
  btn.addEventListener('mouseover', teleport);
  btn.addEventListener('focus', function () { teleport(); btn.blur(); });
  btn.addEventListener('click', function (e) { e.preventDefault(); teleport(); });

  btn.style.transform = 'translate(-50%, 0)';
  window.addEventListener('load', function () { btn.style.transform = 'none'; teleport(); });
  window.addEventListener('resize', teleport);

  force.addEventListener('click', function () {
    btn.style.display = 'none';
    document.getElementById('os').classList.remove('hidden');
    startOS();
  });

  /* ---------- fake desktop ---------- */
  var z = 20, n = 0, done = false, picked = {}, wins = null, wrong = 0, pics = [], cur = 0;
  var exts = ['jpg', 'jpeg', 'png', 'webp', 'gif', 'JPG', 'JPEG', 'PNG', 'avif', 'bmp', 'svg', 'WEBP', 'GIF'];
  var files = {
    c1: ['clue_1.txt', 'CLUE 1 of 3\n\nThe name of the person reading this.\n4 letters. Starts with Z, ends with A.\nYes, you.'],
    c2: ['clue_2.txt', 'CLUE 2 of 3\n\nEncrypted by an intern. Every letter was moved one step forward in the alphabet.\n\nJT\n\nMove each letter one step back.'],
    c3: ['clue_3.txt', 'CLUE 3 of 3\n\nThe verdict, written backwards by the same intern.\n\nBMUD\n\nRead it from the right.'],
    homework: ['homework_final_FINAL.docx', 'Pages: 0\nStatus: not started.\nDo not tell anyone.'],
    excuses: ['excuses_v3.txt', '1. I was studying.\n2. See 1.\n3. She was right anyway.'],
    dignity: ['my_dignity.png', 'Error: file corrupted.\nLast opened: yesterday.']
  };
  var words = ['sorry', 'whatever', 'my bad', 'k', 'I was wrong', 'not my fault', "you're right", 'see you in court', 'forgive me'];
  var good = ['sorry', 'my bad', 'I was wrong', "you're right", 'forgive me'];
  var hints = [
    'Wrong. The password is three clues glued together. No spaces.',
    'Clues live in the Recycle Bin and the Pictures folder.',
    'Order matters: clue 1, then 2, then 3. One is shifted, one is backwards.',
    'Clue 1 is you. Clue 2 decodes to a two letter word. Clue 3 is an insult.'
  ];

  function win(id, title, body) {
    var off = (n++ % 4) * 18;
    return '<div id="' + id + '" class="win absolute hidden border border-black bg-white" style="width:min(92vw,400px);left:calc(50% - min(46vw,200px) + ' + off + 'px);top:' + (70 + off) + 'px;">' +
      '<div class="flex items-center justify-between bg-black px-2 py-1 text-xs text-white"><span id="' + id + '-t">' + title + '</span><button data-close class="border border-white px-2 leading-none">X</button></div>' +
      '<div class="p-4 text-sm leading-relaxed" style="max-height:62vh;overflow-y:auto;">' + body + '</div></div>';
  }
  function fbtn(k) { return '<button data-file="' + k + '" class="mb-2 block w-full border border-black px-2 py-1 text-left text-xs">' + files[k][0] + '</button>'; }

  function probe(i, k, cb) {
    if (k >= exts.length) return cb(null);
    var src = 'pic' + i + '.' + exts[k], im = new Image();
    im.onload = function () { cb(src); };
    im.onerror = function () { probe(i, k + 1, cb); };
    im.src = src;
  }
  function scan(i) {
    if (i > 30) return renderPics();
    probe(i, 0, function (src) { if (!src) return renderPics(); pics.push(src); scan(i + 1); });
  }
  function renderPics() {
    var h = fbtn('c3') + '<div class="grid grid-cols-3 gap-2">';
    pics.forEach(function (src, i) {
      h += '<button data-pic="' + i + '" class="border border-black p-1 text-left"><img src="' + src + '" alt="" class="h-20 w-full object-cover"><span class="block truncate text-[10px]">' + src + '</span></button>';
    });
    h += '</div><p class="mt-3 text-xs">' + pics.length + ' picture(s)</p>';
    document.getElementById('pics-b').innerHTML = h;
  }
  function showPic(i) {
    cur = (i + pics.length) % pics.length;
    document.getElementById('view-i').src = pics[cur];
    document.getElementById('view-n').textContent = pics[cur] + '  (' + (cur + 1) + '/' + pics.length + ')';
    show('w-view');
  }

  function startOS() {
    if (wins) return;
    var c = document.getElementById('wins');
    var cap = words.map(function (w, i) { return '<button data-cap="' + i + '" class="cap h-16 border border-black p-1 text-xs">' + w + '</button>'; }).join('');
    var bin = ['c1', 'c2', 'homework', 'excuses', 'dignity'].map(fbtn).join('');
    c.innerHTML =
      win('w-readme', 'README.txt', 'You used the cheat code. Respect.<br><br>Forgiveness.exe is locked. The password is three clues glued together, in order, no spaces. Capitals do not matter.<br><br>The clues are hidden somewhere on this computer. Not in this file.<br><br>Do not check the Recycle Bin. (Check the Recycle Bin.)') +
      win('w-bin', 'Recycle Bin', bin) +
      win('w-pics', 'C:\\Pictures', '<div id="pics-b">Loading...</div>') +
      win('w-view', 'Photo Viewer', '<img id="view-i" alt="" class="w-full object-contain" style="max-height:45vh;"><p id="view-n" class="mt-2 text-xs"></p><div class="mt-2 flex gap-2"><button data-nav="-1" class="border border-black px-3 py-1 text-xs">Prev</button><button data-nav="1" class="border border-black px-3 py-1 text-xs">Next</button></div>') +
      win('w-file', 'file', '<pre id="file-b" class="whitespace-pre-wrap font-mono"></pre>') +
      win('w-exe', 'Forgiveness.exe', 'Access denied.<br>Enter password:<input id="pw" type="text" autocomplete="off" autocapitalize="off" class="mt-2 block w-full border border-black px-2 py-1 text-sm"><div class="mt-3 flex gap-2"><button id="pw-go" class="border border-black px-3 py-1 text-xs">Unlock</button><button id="pw-h" class="border border-black px-3 py-1 text-xs">Hint</button></div><p id="pw-e" class="mt-3 text-xs"></p>') +
      win('w-cap', 'Verify you are human', 'Select all squares that contain an apology.<div class="mt-3 grid grid-cols-3 gap-1">' + cap + '</div><button id="cap-go" class="mt-3 border border-black px-3 py-1 text-xs">Verify</button><p id="cap-e" class="mt-3 text-xs"></p>') +
      win('w-arc', 'Arcade.exe - Whack Yash', '<p id="arc-s" class="text-xs">Whack Yash. 20 seconds. Press Start.</p><div id="arc-g" class="mt-3 grid grid-cols-3 gap-1">' + [0,1,2,3,4,5,6,7,8].map(function (i) { return '<button data-arc="' + i + '" class="arc h-16 border border-black text-xs"></button>'; }).join('') + '</div><button id="arc-go" class="mt-3 border border-black px-3 py-1 text-xs">Start</button><p id="arc-r" class="mt-3 text-xs"></p>') +
      win('w-fin', 'Forgiveness.exe', '<div id="fin-b"><pre class="whitespace-pre-wrap font-mono">Captcha: passed.\nHuman: confirmed.\nPending action: forgive Yash.\n\nYash is awaiting your decision.\nHe has been told not to refresh.</pre><button id="fy" class="mt-4 w-full border border-black bg-black px-3 py-3 text-sm text-white">Forgive Yash</button></div>');
    wins = c;
    show('w-readme');
    scan(1);
    tick(); setInterval(tick, 20000);
  }
  function tick() { document.getElementById('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
  function show(id) { var w = document.getElementById(id); w.style.display = 'block'; w.style.zIndex = ++z; }
  function hide(w) { w.style.display = 'none'; }
  function openFile(t, b) { document.getElementById('w-file-t').textContent = t; document.getElementById('file-b').textContent = b; show('w-file'); }
  function shutdown() {
    if (!done) { openFile('System Error', 'Cannot shut down.\nForgiveness.exe is still running.'); return; }
    var o = document.getElementById('off'); o.classList.remove('hidden'); o.classList.add('flex');
  }

  /* ---------- arcade ---------- */
  var arc = { on: false, hits: 0, miss: 0, t: 20, tgt: -1, a: null, b: null, best: 0 };
  function arcDraw() {
    document.querySelectorAll('.arc').forEach(function (b, i) {
      var on = arc.on && i === arc.tgt;
      b.textContent = on ? 'YASH' : '';
      b.style.background = on ? '#000' : '#fff';
      b.style.color = on ? '#fff' : '#000';
    });
    document.getElementById('arc-s').textContent = 'Time ' + arc.t + '  Hits ' + arc.hits + '  Misses ' + arc.miss;
  }
  function arcMove() { var x; do { x = Math.floor(Math.random() * 9); } while (x === arc.tgt); arc.tgt = x; arcDraw(); }
  function arcStart() {
    if (arc.on) return;
    arc.on = true; arc.hits = 0; arc.miss = 0; arc.t = 20;
    document.getElementById('arc-r').textContent = '';
    document.getElementById('arc-go').textContent = 'Running';
    arcMove();
    arc.a = setInterval(function () { arc.t--; if (arc.t <= 0) arcEnd(); else arcDraw(); }, 1000);
    arc.b = setInterval(arcMove, 750);
  }
  function arcHit(i) {
    if (!arc.on) return;
    if (i === arc.tgt) { arc.hits++; arcMove(); } else { arc.miss++; arcDraw(); }
  }
  function arcEnd() {
    clearInterval(arc.a); clearInterval(arc.b);
    arc.on = false; arc.tgt = -1; arc.t = 0; arcDraw();
    document.getElementById('arc-go').textContent = 'Play again';
    var h = arc.hits, m = arc.miss, r;
    if (h === 0) r = 'Zero. Yash walked away untouched. The button has more fight than you.';
    else if (h <= 5) r = 'Score ' + h + '. Yash has been mildly inconvenienced. He is not even sitting down.';
    else if (h <= 12) r = 'Score ' + h + '. Respectable. Yash is sore but will survive and will still not study.';
    else if (h <= 20) r = 'Score ' + h + '. Okay, violent. Yash is filing a report with himself.';
    else r = 'Score ' + h + '. Yash has left the building. Forgiveness is now optional.';
    if (m > h) r += ' ' + m + ' misses. More misses than hits. You were fighting the wall.';
    else if (m === 0 && h > 0) r += ' Zero misses. Scary accuracy. Noted.';
    if (h > arc.best) { if (arc.best) r += ' New best.'; arc.best = h; } else if (arc.best) r += ' Best so far: ' + arc.best + '.';
    document.getElementById('arc-r').textContent = r;
  }

  document.getElementById('os').addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t) return;
    if (t.dataset.open) show(t.dataset.open);
    else if (t.hasAttribute('data-close')) hide(t.closest('.win'));
    else if (t.dataset.file) openFile(files[t.dataset.file][0], files[t.dataset.file][1]);
    else if (t.dataset.pic) showPic(+t.dataset.pic);
    else if (t.dataset.nav) { if (pics.length) showPic(cur + +t.dataset.nav); }
    else if (t.dataset.cap) { var i = t.dataset.cap; picked[i] = !picked[i]; t.style.background = picked[i] ? '#000' : '#fff'; t.style.color = picked[i] ? '#fff' : '#000'; }
    else if (t.id === 'pw-go') {
      var v = document.getElementById('pw').value.replace(/\s+/g, '').toLowerCase();
      if (v === 'zohaisdumb') { hide(document.getElementById('w-exe')); show('w-cap'); }
      else { document.getElementById('pw-e').textContent = v ? hints[Math.min(wrong, hints.length - 1)] : 'Empty password. Bold, but no.'; if (v) wrong++; }
    }
    else if (t.id === 'pw-h') { document.getElementById('pw-e').textContent = hints[Math.min(wrong, hints.length - 1)]; wrong++; }
    else if (t.id === 'cap-go') {
      var ok = words.every(function (w, i) { return !!picked[i] === (good.indexOf(w) > -1); });
      if (ok) { hide(document.getElementById('w-cap')); show('w-fin'); }
      else {
        document.getElementById('cap-e').textContent = 'Incorrect. Please try being nicer.';
        picked = {}; document.querySelectorAll('.cap').forEach(function (b) { b.style.background = '#fff'; b.style.color = '#000'; });
      }
    }
    else if (t.dataset.arc) arcHit(+t.dataset.arc);
    else if (t.id === 'arc-go') arcStart();
    else if (t.id === 'fy') {
      done = true;
      document.getElementById('fin-b').innerHTML = '<pre class="whitespace-pre-wrap font-mono">Yash has been forgiven.\n\nTerms:\n1. Yash studies.\n2. No questions.\n3. This cannot be undone.\n\nShutdown is now allowed.</pre><button data-shut class="mt-4 border border-black px-3 py-1 text-xs">Shut Down</button>';
    }
    else if (t.hasAttribute('data-shut') || t.id === 'shut') shutdown();
  });
})();
</script>
</body>
</html>
