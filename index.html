<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#ffffff">
<title>DEAL OR NO DEAL</title>
<style>
*,*::before,*::after{box-sizing:border-box;transition:none!important;animation:none!important;-webkit-tap-highlight-color:transparent}
:root{--tb:calc(56px + env(safe-area-inset-bottom,0px));--st:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#fff;color:#000;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;background:#fff;border:1px solid #000;padding:0;cursor:pointer;touch-action:manipulation;border-radius:0}
button:active{background:#000!important;color:#fff!important}
h1,p{margin:0}
.hidden{display:none}
/* intro */
#hdr{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;align-items:center;padding:calc(var(--st) + 24px) 16px 0;text-align:center;pointer-events:none}
#hdr .t{border:1px solid #000;padding:8px 16px;letter-spacing:.1em}
#hdr p{max-width:28rem;margin-top:12px}
#msg{font-size:12px}
#evade{position:absolute;left:50%;top:60%;padding:14px 24px;font-size:16px;white-space:nowrap;touch-action:none;z-index:5}
#force{position:absolute;left:0;bottom:0;z-index:20;border:0;background:transparent;text-decoration:underline;font-size:12px;padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));min-height:48px}
/* fake OS */
#os{position:fixed;inset:0;z-index:50;background:#fff;touch-action:pan-y}
#icons{position:absolute;left:12px;right:12px;top:calc(var(--st) + 12px);display:flex;flex-wrap:wrap;gap:12px}
#icons button{width:84px;min-height:84px;border:0;background:transparent;text-align:center;font-size:12px;padding:6px 0}
#icons .ic{display:flex;align-items:center;justify-content:center;width:36px;height:44px;margin:0 auto 4px;border:1px solid #000;font-size:9px}
#icons .ic.dark{background:#000;color:#fff}
#tb{position:absolute;left:0;right:0;bottom:0;z-index:5000;height:var(--tb);padding:0 8px env(safe-area-inset-bottom,0px);display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border-top:1px solid #000}
#tb .g{display:flex;gap:8px}
#tb button{min-height:44px;padding:0 18px;font-size:14px}
#clock{font-size:12px}
/* windows */
.win{position:absolute;display:none;flex-direction:column;background:#fff;border:1px solid #000;width:min(92vw,420px);max-height:calc(100% - var(--tb) - var(--st) - 24px)}
.win-h{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#000;color:#fff;padding:0 0 0 12px;flex:none}
.win-h span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win-h button{flex:none;background:#000;color:#fff;border:0;border-left:1px solid #fff;min-width:56px;min-height:48px;font-size:18px}
.win-h button:active{background:#fff!important;color:#000!important}
.win-b{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:16px;-webkit-user-select:text;user-select:text}
.fb{display:block;width:100%;text-align:left;padding:14px 12px;margin-bottom:8px}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pg button{padding:4px;text-align:left}
.pg img{display:block;width:100%;height:80px;object-fit:cover}
.pg span{display:block;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.cap,.arc{min-height:64px;font-size:14px;padding:4px}
.arc{min-height:76px}
.act{display:flex;gap:8px;margin-top:12px}
.btn{padding:12px 18px;min-height:48px}
.inp{display:block;width:100%;margin-top:8px;padding:12px;border:1px solid #000;font:inherit;font-size:16px;border-radius:0;-webkit-user-select:text;user-select:text}
.small{font-size:12px;margin-top:12px}
pre{margin:0;white-space:pre-wrap;font:inherit;-webkit-user-select:text;user-select:text}
#view-i{display:block;width:100%;max-height:50vh;object-fit:contain}
#off{position:fixed;inset:0;z-index:9000;background:#fff;display:none;align-items:center;justify-content:center;padding:32px;text-align:center}
@media (max-width:639px){
  .win{position:fixed!important;left:0!important;right:0!important;top:var(--st)!important;bottom:var(--tb)!important;width:auto!important;max-height:none!important;border-left:0;border-right:0}
  #icons button{width:calc((100% - 24px)/3)}
}
@media (min-width:640px){#icons{flex-direction:column;flex-wrap:nowrap;right:auto}}
</style>
</head>
<body>

<header id="hdr">
  <div class="t">DEAL OR NO DEAL</div>
  <p>I am sorry. Catch the button and forgive me. If you can't, the deal is I get to study in peace and you get to be right.</p>
  <p id="msg">Take a breath first. The button is very fast.</p>
</header>

<button id="evade" type="button">Click to Forgive</button>
<button id="force" type="button">Force Forgive</button>

<div id="os" class="hidden">
  <div id="icons">
    <button data-open="w-readme"><span class="ic">TXT</span>README.txt</button>
    <button data-open="w-bin"><span class="ic">BIN</span>Recycle Bin</button>
    <button data-open="w-pics"><span class="ic">DIR</span>Pictures</button>
    <button data-open="w-arc"><span class="ic">GAME</span>Arcade.exe</button>
    <button data-open="w-exe"><span class="ic dark">EXE</span>Forgiveness.exe</button>
  </div>
  <div id="wins"></div>
  <div id="tb">
    <div class="g"><button id="back">Close</button><button id="shut">Shut Down</button></div>
    <span id="clock"></span>
  </div>
</div>
<div id="off">
  <div><p style="font-size:18px">It is now safe to turn off your computer.</p><p style="margin-top:24px;font-size:12px">Forgiven. Go be right somewhere else. I have a test to pass.</p></div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var btn = $('evade'), force = $('force'), msg = $('msg');
  var px = -1, py = -1, dodges = 0, lastDodge = 0;

  var lines = [
    'Slow down. Breathe in.',
    'The button is shy. It is not you.',
    'Almost. Not really. But almost.',
    'Breathe out. You are doing great.',
    'It has been to the gym. Skipping leg day was not an option for it.',
    'You are allowed to be mad. You are also allowed to cheat.',
    'Unclench your jaw. Now try again.',
    'Still nothing. The button has no loyalty.',
    'Fine. Force Forgive exists. I will not tell anyone.'
  ];

  function place() {
    var w = window.innerWidth, h = window.innerHeight;
    var bw = btn.offsetWidth, bh = btn.offsetHeight;
    var minTop = $('hdr').offsetHeight + 24, minBottom = 64;
    var x, y, tries = 0;
    do {
      x = Math.random() * Math.max(1, w - bw);
      y = minTop + Math.random() * Math.max(1, h - bh - minTop - minBottom);
      tries++;
    } while (tries < 30 && px >= 0 && px > x - 20 && px < x + bw + 20 && py > y - 20 && py < y + bh + 20);
    btn.style.left = x + 'px';
    btn.style.top = y + 'px';
  }
  // one dodge per touch/mouse gesture even though several events fire
  function teleport() {
    var now = Date.now();
    if (now - lastDodge < 200) return;
    lastDodge = now;
    dodges++;
    if (dodges > 1) msg.textContent = lines[(dodges - 2) % lines.length];
    place();
  }
  function track(e) { px = e.clientX; py = e.clientY; }

  document.addEventListener('pointermove', track);
  btn.addEventListener('pointerenter', function (e) { track(e); teleport(); });
  btn.addEventListener('pointerdown', function (e) { e.preventDefault(); track(e); teleport(); });
  btn.addEventListener('touchstart', function (e) { e.preventDefault(); teleport(); }, { passive: false });
  btn.addEventListener('mouseover', teleport);
  btn.addEventListener('focus', function () { teleport(); btn.blur(); });
  btn.addEventListener('click', function (e) { e.preventDefault(); teleport(); });

  btn.style.transform = 'translate(-50%, 0)';
  window.addEventListener('load', function () { btn.style.transform = 'none'; place(); });
  window.addEventListener('resize', place);

  function goForce(e) {
    if (e) e.preventDefault();
    btn.style.display = 'none';
    force.style.display = 'none';
    $('os').classList.remove('hidden');
    startOS();
  }
  force.addEventListener('click', goForce);

  /* ---------- fake desktop ---------- */
  var z = 20, n = 0, done = false, picked = {}, wins = null, wrong = 0, pics = [], cur = 0;
  var exts = ['jpg', 'jpeg', 'png', 'webp', 'gif', 'JPG', 'JPEG', 'PNG', 'avif', 'bmp', 'svg', 'WEBP', 'GIF'];
  var files = {
    c1: ['clue_1.txt', 'CLUE 1 of 3\n\nThe name of the person reading this.\n4 letters. Starts with Z, ends with A.\nYes, you.'],
    c2: ['clue_2.txt', 'CLUE 2 of 3\n\nEncrypted by an intern. Every letter was moved one step forward in the alphabet.\n\nJT\n\nMove each letter one step back.'],
    c3: ['clue_3.txt', 'CLUE 3 of 3\n\nThe verdict, written backwards by the same intern.\n\nBMUD\n\nRead it from the right.'],
    homework: ['homework_final_FINAL.docx', 'Pages: 0\nStatus: not started.\nDo not tell anyone.'],
    excuses: ['excuses_v3.txt', '1. I was studying.\n2. See 1.\n3. She was right anyway.'],
    dignity: ['my_dignity.png', 'Error: file corrupted.\nLast opened: yesterday.']
  };
  var words = ['sorry', 'whatever', 'my bad', 'k', 'I was wrong', 'not my fault', "you're right", 'see you in court', 'forgive me'];
  var good = ['sorry', 'my bad', 'I was wrong', "you're right", 'forgive me'];
  var hints = [
    'Wrong. The password is three clues glued together. No spaces.',
    'Clues live in the Recycle Bin and the Pictures folder.',
    'Order matters: clue 1, then 2, then 3. One is shifted, one is backwards.',
    'Clue 1 is you. Clue 2 decodes to a two letter word. Clue 3 is an insult.'
  ];

  function win(id, title, body) {
    var off = (n++ % 4) * 18;
    return '<div id="' + id + '" class="win" style="left:calc(50% - min(46vw,210px) + ' + off + 'px);top:' + (70 + off) + 'px;">' +
      '<div class="win-h"><span id="' + id + '-t">' + title + '</span><button data-close aria-label="Close">X</button></div>' +
      '<div class="win-b">' + body + '</div></div>';
  }
  function fbtn(k) { return '<button data-file="' + k + '" class="fb">' + files[k][0] + '</button>'; }

  function probe(i, k, cb) {
    if (k >= exts.length) return cb(null);
    var src = 'pic' + i + '.' + exts[k], im = new Image();
    im.onload = function () { cb(src); };
    im.onerror = function () { probe(i, k + 1, cb); };
    im.src = src;
  }
  function scan(i) {
    if (i > 30) return renderPics();
    probe(i, 0, function (src) { if (!src) return renderPics(); pics.push(src); scan(i + 1); });
  }
  function renderPics() {
    var h = fbtn('c3') + '<div class="pg">';
    pics.forEach(function (src, i) {
      h += '<button data-pic="' + i + '"><img src="' + src + '" alt=""><span>' + src + '</span></button>';
    });
    h += '</div><p class="small">' + pics.length + ' picture(s)</p>';
    $('pics-b').innerHTML = h;
  }
  function showPic(i) {
    cur = (i + pics.length) % pics.length;
    $('view-i').src = pics[cur];
    $('view-n').textContent = pics[cur] + '  (' + (cur + 1) + '/' + pics.length + ')';
    show('w-view');
  }

  function startOS() {
    if (wins) return;
    var c = $('wins');
    var cap = words.map(function (w, i) { return '<button data-cap="' + i + '" class="cap">' + w + '</button>'; }).join('');
    var bin = ['c1', 'c2', 'homework', 'excuses', 'dignity'].map(fbtn).join('');
    c.innerHTML =
      win('w-readme', 'README.txt', 'You used the cheat code. Respect.<br><br>Forgiveness.exe is locked. The password is three clues glued together, in order, no spaces. Capitals do not matter.<br><br>The clues are hidden somewhere on this computer. Not in this file.<br><br>Do not check the Recycle Bin. (Check the Recycle Bin.)') +
      win('w-bin', 'Recycle Bin', bin) +
      win('w-pics', 'C:\\Pictures', '<div id="pics-b">Loading...</div>') +
      win('w-view', 'Photo Viewer', '<img id="view-i" alt=""><p id="view-n" class="small"></p><div class="act"><button data-nav="-1" class="btn">Prev</button><button data-nav="1" class="btn">Next</button></div>') +
      win('w-file', 'file', '<pre id="file-b"></pre>') +
      win('w-exe', 'Forgiveness.exe', 'Access denied.<br>Enter password:<input id="pw" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" class="inp"><div class="act"><button id="pw-go" class="btn">Unlock</button><button id="pw-h" class="btn">Hint</button></div><p id="pw-e" class="small"></p>') +
      win('w-cap', 'Verify you are human', 'Select all squares that contain an apology.<div class="cg">' + cap + '</div><div class="act"><button id="cap-go" class="btn">Verify</button></div><p id="cap-e" class="small"></p>') +
      win('w-arc', 'Arcade.exe - Whack Yash', '<p id="arc-s">Whack Yash. 20 seconds. Press Start.</p><div id="arc-g" class="cg">' + [0,1,2,3,4,5,6,7,8].map(function (i) { return '<button data-arc="' + i + '" class="arc"></button>'; }).join('') + '</div><div class="act"><button id="arc-go" class="btn">Start</button></div><p id="arc-r" class="small"></p>') +
      win('w-fin', 'Forgiveness.exe', '<div id="fin-b"><pre>Captcha: passed.\nHuman: confirmed.\nPending action: forgive Yash.\n\nYash is awaiting your decision.\nHe has been told not to refresh.</pre><div class="act"><button id="fy" class="btn" style="width:100%;background:#000;color:#fff">Forgive Yash</button></div></div>');
    wins = c;
    var pw = $('pw');
    pw.addEventListener('focus', function () { setTimeout(function () { pw.scrollIntoView({ block: 'center' }); }, 300); });
    pw.addEventListener('keydown', function (e) { if (e.key === 'Enter') $('pw-go').click(); });
    show('w-readme');
    scan(1);
    tick(); setInterval(tick, 20000);
  }
  function tick() { $('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
  function show(id) {
    var w = $(id);
    w.style.display = 'flex';
    if (z > 4000) z = 20;
    w.style.zIndex = ++z;
    var b = w.querySelector('.win-b'); if (b) b.scrollTop = 0;
  }
  function hide(w) { w.style.display = 'none'; }
  function closeTop() {
    var top = null;
    document.querySelectorAll('.win').forEach(function (w) { if (w.style.display === 'flex' && (!top || +w.style.zIndex > +top.style.zIndex)) top = w; });
    if (top) hide(top);
  }
  function openFile(t, b) { $('w-file-t').textContent = t; $('file-b').textContent = b; show('w-file'); }
  function shutdown() {
    if (!done) { openFile('System Error', 'Cannot shut down.\nForgiveness.exe is still running.'); return; }
    $('off').style.display = 'flex';
  }

  /* ---------- arcade ---------- */
  var arc = { on: false, hits: 0, miss: 0, t: 20, tgt: -1, a: null, b: null, best: 0 };
  function arcDraw() {
    document.querySelectorAll('.arc').forEach(function (b, i) {
      var on = arc.on && i === arc.tgt;
      b.textContent = on ? 'YASH' : '';
      b.style.background = on ? '#000' : '#fff';
      b.style.color = on ? '#fff' : '#000';
    });
    $('arc-s').textContent = 'Time ' + arc.t + '  Hits ' + arc.hits + '  Misses ' + arc.miss;
  }
  function arcMove() { var x; do { x = Math.floor(Math.random() * 9); } while (x === arc.tgt); arc.tgt = x; arcDraw(); }
  function arcStart() {
    if (arc.on) return;
    arc.on = true; arc.hits = 0; arc.miss = 0; arc.t = 20;
    $('arc-r').textContent = '';
    $('arc-go').textContent = 'Running';
    arcMove();
    arc.a = setInterval(function () { arc.t--; if (arc.t <= 0) arcEnd(); else arcDraw(); }, 1000);
    arc.b = setInterval(arcMove, 750);
  }
  function arcHit(i) {
    if (!arc.on) return;
    if (i === arc.tgt) { arc.hits++; arcMove(); } else { arc.miss++; arcDraw(); }
  }
  function arcEnd() {
    clearInterval(arc.a); clearInterval(arc.b);
    arc.on = false; arc.tgt = -1; arc.t = 0; arcDraw();
    $('arc-go').textContent = 'Play again';
    var h = arc.hits, m = arc.miss, r;
    if (h === 0) r = 'Zero. Yash walked away untouched. The button has more fight than you.';
    else if (h <= 5) r = 'Score ' + h + '. Yash has been mildly inconvenienced. He is not even sitting down.';
    else if (h <= 12) r = 'Score ' + h + '. Respectable. Yash is sore but will survive and will still not study.';
    else if (h <= 20) r = 'Score ' + h + '. Okay, violent. Yash is filing a report with himself.';
    else r = 'Score ' + h + '. Yash has left the building. Forgiveness is now optional.';
    if (m > h) r += ' ' + m + ' misses. More misses than hits. You were fighting the wall.';
    else if (m === 0 && h > 0) r += ' Zero misses. Scary accuracy. Noted.';
    if (h > arc.best) { if (arc.best) r += ' New best.'; arc.best = h; } else if (arc.best) r += ' Best so far: ' + arc.best + '.';
    $('arc-r').textContent = r;
  }

  // arcade taps fire on touch-down so fast whacks are not lost
  $('os').addEventListener('pointerdown', function (e) {
    var t = e.target.closest('button[data-arc]');
    if (t) { e.preventDefault(); arcHit(+t.dataset.arc); t._h = Date.now(); }
  });

  $('os').addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t) return;
    if (t.dataset.arc) return;
    if (t.dataset.open) show(t.dataset.open);
    else if (t.hasAttribute('data-close')) hide(t.closest('.win'));
    else if (t.dataset.file) openFile(files[t.dataset.file][0], files[t.dataset.file][1]);
    else if (t.dataset.pic) showPic(+t.dataset.pic);
    else if (t.dataset.nav) { if (pics.length) showPic(cur + +t.dataset.nav); }
    else if (t.dataset.cap) { var i = t.dataset.cap; picked[i] = !picked[i]; t.style.background = picked[i] ? '#000' : '#fff'; t.style.color = picked[i] ? '#fff' : '#000'; }
    else if (t.id === 'pw-go') {
      var v = $('pw').value.replace(/\s+/g, '').toLowerCase();
      if (v === 'zohaisdumb') { hide($('w-exe')); show('w-cap'); }
      else { $('pw-e').textContent = v ? hints[Math.min(wrong, hints.length - 1)] : 'Empty password. Bold, but no.'; if (v) wrong++; }
    }
    else if (t.id === 'pw-h') { $('pw-e').textContent = hints[Math.min(wrong, hints.length - 1)]; wrong++; }
    else if (t.id === 'cap-go') {
      var ok = words.every(function (w, i) { return !!picked[i] === (good.indexOf(w) > -1); });
      if (ok) { hide($('w-cap')); show('w-fin'); }
      else {
        $('cap-e').textContent = 'Incorrect. Please try being nicer.';
        picked = {}; document.querySelectorAll('.cap').forEach(function (b) { b.style.background = '#fff'; b.style.color = '#000'; });
      }
    }
    else if (t.id === 'arc-go') arcStart();
    else if (t.id === 'fy') {
      done = true;
      $('fin-b').innerHTML = '<pre>Yash has been forgiven.\n\nTerms:\n1. Yash studies.\n2. No questions.\n3. This cannot be undone.\n\nShutdown is now allowed.</pre><div class="act"><button data-shut class="btn">Shut Down</button></div>';
    }
    else if (t.id === 'back') closeTop();
    else if (t.hasAttribute('data-shut') || t.id === 'shut') shutdown();
  });

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && wins) closeTop(); });
})();
</script>
</body>
</html>
